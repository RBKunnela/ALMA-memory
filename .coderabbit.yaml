# CodeRabbit DISABLED — Chefe 1792 (2026-08-07)
# Own review path: George + CI + Sentinel dogfood + LLM-Hub (no third-party review quotas)
# To re-enable: restore from .coderabbit.yaml.bak-pre-disable-1792 and reinstall GitHub App if removed.

language: en-US

reviews:
  profile: chill
  disable_proposed_changes: true
  auto_review:
    enabled: false
    drafts: false
    base_branches: []
  request_changes_workflow: false
  high_level_summary: false
  review_status: false
  poem: false
  collapse_walkthrough: true
  sequence_diagrams: false
  changed_files_summary: false

# Chat also off when possible
chat:
  auto_reply: false
